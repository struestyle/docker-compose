services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: stirlingpdf
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - stirling-pdf-data:/usr/share/tessdata
      - stirling-pdf-data:/configs
      - stirling-pdf-data:/customFiles/
      - stirling-pdf-data:/logs/
      - stirling-pdf-data:/pipeline/
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - LANGS=fr_FR

volumes:
  stirling-pdf-data:
    name: stirling-pdf-data