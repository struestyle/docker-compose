entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: "https"
          scheme: "https"
  https:
    address: ":443"

api:
  dashboard: true
  insecure: true

certificatesResolvers:
  myresolver:
    acme:
      email: louis@discorads.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        # used during the challenge
        entryPoint: http

providers:
  docker:
    exposedByDefault: true
