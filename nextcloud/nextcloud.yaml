version: '3'

services:
  nextcloud:
    image: nextcloud:latest  # Utilise la dernière version officielle de Nextcloud
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"  # Port exposé (modifiable selon vos besoins)
    volumes:
      - nextcloud_data:/var/www/html  # Stockage persistant des fichiers et config
    env_file:
      - ./nextcloud.env
    depends_on:
      - db
    networks:
      - nextcloud_net

  db:
    image: mariadb:10.6  # MariaDB comme base de données
    container_name: nextcloud_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW  # Optimisations pour Nextcloud
    volumes:
      - db_data:/var/lib/mysql  # Stockage persistant de la base
    env_file:
      - ./db.env
    networks:
      - nextcloud_net

volumes:
  nextcloud_data:
  db_data:

networks:
  nextcloud_net:
    driver: bridge
